<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>HSK 1~3급 단어</title>
<link rel="icon" href="icon-32.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HSK 단어">
<meta name="theme-color" content="#b8432f">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@900&display=swap" rel="stylesheet">
<style>
:root {
  /* 아이콘(中, 빨강)과 맞춘 색. 바탕은 종이 같은 미색 */
  --bg: #f7f1e7;
  --card: #fffdf9;
  --ink: #2b2420;
  --muted: #7d726a;
  --line: #e8dfd2;
  --accent: #b8432f;
  --accent-ink: #ffffff;
  --accent-soft: #f6e3dd;
  --ok: #2f7d50;
  --ok-soft: #e3f1e6;
  --warn: #9a6a12;
  --warn-soft: #f8edd3;
  --bad: #a33327;
  --bad-soft: #f8e0da;
  --chip: #f0e8dc;
  --mark: #ffe6a3;
  --shadow: 0 1px 2px rgba(80, 50, 30, .06), 0 6px 20px rgba(80, 50, 30, .07);
  --fs: 17px;
  --zh: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1c1816; --card: #272220; --ink: #f1ebe3; --muted: #a89e93; --line: #3b342e;
    --accent: #e4826c; --accent-ink: #1c1816; --accent-soft: #412823;
    --ok: #6cc28c; --ok-soft: #1f3327; --warn: #e2b155; --warn-soft: #3a2f1a;
    --bad: #ec8073; --bad-soft: #3c2320; --chip: #342d28; --mark: #5a4a1e; --shadow: none;
  }
}
:root[data-theme="dark"] {
--bg: #1c1816; --card: #272220; --ink: #f1ebe3; --muted: #a89e93; --line: #3b342e;
  --accent: #e4826c; --accent-ink: #1c1816; --accent-soft: #412823;
  --ok: #6cc28c; --ok-soft: #1f3327; --warn: #e2b155; --warn-soft: #3a2f1a;
  --bad: #ec8073; --bad-soft: #3c2320; --chip: #342d28; --mark: #5a4a1e; --shadow: none;
}
:root.big { --fs: 20px; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  font-size: var(--fs); line-height: 1.6;
}
.wrap { max-width: 560px; margin: 0 auto; padding: 18px 16px 56px; }
/* 첫 화면 머리: 아이콘 + 제목 */
.brand { display: flex; align-items: center; gap: 12px; margin: 4px 0 18px; }
.brand img { width: 44px; height: 44px; border-radius: 12px; box-shadow: var(--shadow); }
.brand h1 { margin: 0; font-size: 1.45em; line-height: 1.2; }
.brand .sub { margin: 2px 0 0; font-size: .88em; }
.zh { font-family: var(--zh); }
/* 병음은 성조 부호가 제자리에 붙는 라틴 글꼴로 (한글 글꼴은 ē·ǎ 부호가 어긋나 보이기도 한다) */
.py, .big-py, .sentence-py, .choice.pyc { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
h1 { font-size: 1.5em; margin: 8px 0 4px; letter-spacing: -.01em; font-weight: 700; }
.sub { color: var(--muted); margin: 0 0 20px; }
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: 22px;
  padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow);
}
/* 오늘 할 일 카드 */
.hero { text-align: center; padding-top: 22px; }
.hero .big { font-size: 3.2em; font-weight: 800; line-height: 1; color: var(--accent); letter-spacing: -.02em; margin: 6px 0 2px; }
.hero .big small { font-size: .38em; font-weight: 700; margin-left: 4px; color: var(--ink); }
.hero .what { color: var(--muted); margin: 0 0 16px; font-size: .95em; }
.hero .done { font-size: 2.2em; line-height: 1.2; margin: 4px 0 2px; }
.hicon { width: 68px; height: 68px; margin: 6px auto 8px; border-radius: 50%; background: var(--chip); color: var(--accent); display: grid; place-items: center; }
.hicon svg { width: 46px; height: 46px; }
.donebox { display: flex; align-items: center; gap: 18px; text-align: left; margin: 8px 0 18px; }
.ring { position: relative; width: 96px; height: 96px; flex: none; display: grid; place-content: center; text-align: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring .rt { fill: none; stroke: var(--chip); stroke-width: 9; }
.ring .ra { fill: none; stroke: var(--accent); stroke-width: 9; stroke-linecap: round; animation: ringIn .9s ease-out; }
@keyframes ringIn { from { stroke-dashoffset: var(--c); } }
.ring b { font-size: 1.9em; line-height: 1; color: var(--accent); font-weight: 800; }
.ring small { font-size: .72em; color: var(--muted); margin-top: 2px; }
.dtext { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.dtitle { font-size: 1.25em; }
.dstats { font-size: .92em; font-weight: 700; color: var(--ink); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.dstats i { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); display: inline-block; }
.dtext small { color: var(--muted); line-height: 1.45; }
.btn:has(.bsub) { flex-direction: column; gap: 0; }
.btn .bsub { display: block; font-size: .72em; font-weight: 500; color: var(--muted); margin-top: 2px; }
.btn:not(.ghost) .bsub { color: rgba(255, 255, 255, .85); }
@media (prefers-reduced-motion: reduce) { .ring .ra { animation: none; } }
.hero .mt { margin-top: 10px; }
/* 메뉴 타일 */
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 2px; text-align: left; padding: 14px 16px; min-height: 84px; border-radius: 18px; background: var(--card); border: 1px solid var(--line); box-shadow: var(--shadow); }
.tile .ic { font-size: 1.5em; line-height: 1; margin-bottom: 6px; }
.tile b { font-size: 1em; }
.tile small { color: var(--muted); font-size: .8em; line-height: 1.3; }
.tile:active { transform: scale(.985); }
.stat { display: flex; gap: 10px; }
.stat div { flex: 1; background: var(--chip); border-radius: 14px; padding: 12px 6px; text-align: center; }
.stat b { display: block; font-size: 1.45em; line-height: 1.2; font-weight: 800; }
.stat span { color: var(--muted); font-size: .82em; }
button {
  font: inherit; color: inherit; cursor: pointer; border: 0; background: none;
  -webkit-tap-highlight-color: transparent;
}
.btn {
  display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
  min-height: 56px; padding: 12px 18px; border-radius: 16px; font-weight: 700; font-size: 1.05em;
  background: var(--accent); color: var(--accent-ink); box-shadow: 0 6px 16px rgba(184, 67, 47, .22);
  transition: transform .08s;
}
.btn:active { transform: scale(.985); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); font-weight: 600; box-shadow: none; }
.btn + .btn { margin-top: 10px; }
.row { display: flex; gap: 10px; }
.row .btn { margin-top: 0; }
.link { color: var(--muted); text-decoration: underline; font-size: .9em; padding: 8px 0; }
.toggle {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 12px 0; border-top: 1px solid var(--line);
}
.toggle:first-of-type { border-top: 0; }
.toggle small { display: block; color: var(--muted); font-size: .82em; }
.switch { position: relative; width: 52px; height: 30px; flex: none; border-radius: 99px; background: var(--line); transition: background .15s; }
.switch::after {
  content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px;
  border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2);
}
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(22px); }
.switch:disabled { opacity: .4; cursor: default; }
.seg { display: flex; gap: 6px; flex: none; }
.seg button { min-width: 46px; height: 38px; padding: 0 10px; border-radius: 12px; border: 1.5px solid var(--line); font-size: .92em; }
.seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
.plan { background: var(--accent-soft); border-radius: 14px; padding: 12px 14px; margin: 14px 0 0; }
.plan b { color: var(--accent); }

/* 진도 막대 */
.prog { margin-top: 14px; }
.prog .lbl { display: flex; justify-content: space-between; font-size: .85em; color: var(--muted); margin-bottom: 4px; }
.prog .track { height: 12px; border-radius: 99px; background: var(--chip); overflow: hidden; display: flex; }
.prog .track i { display: block; height: 100%; }
.prog .track .m { background: var(--ok); }
.prog .track .l { background: var(--accent); opacity: .55; }
.prog + .prog { margin-top: 10px; }

/* 문제 화면 */
.top { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.top .back { font-size: 1.4em; width: 40px; height: 40px; border-radius: 50%; }
.bar { flex: 1; height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .25s; }
.count { color: var(--muted); font-size: .85em; white-space: nowrap; }
.prevq { background: var(--chip); border: 0; border-radius: 99px; padding: 4px 10px; font: inherit; font-size: .78em; font-weight: 700; color: var(--muted); white-space: nowrap; cursor: pointer; box-shadow: none; }
.meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chip { background: var(--chip); border-radius: 99px; padding: 2px 10px; font-size: .8em; color: var(--muted); }
.chip.sec { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.prompt { font-size: 1.08em; font-weight: 500; margin: 0 0 14px; }
.big-zh { font-family: var(--zh); font-size: 2.9em; font-weight: 500; text-align: center; margin: 8px 0 2px; line-height: 1.3; }
.big-py { text-align: center; color: var(--muted); margin-bottom: 8px; font-size: 1.1em; }
.sentence { font-family: var(--zh); font-size: 1.6em; text-align: center; margin: 6px 0 6px; letter-spacing: .02em; line-height: 1.55; }
.sentence-py { text-align: center; color: var(--muted); margin: 0 0 14px; font-size: .92em; }
.pyhide { text-align: center; margin: -4px 0 12px; }
.pyhide .link { font-size: .85em; }
mark { background: var(--mark); color: inherit; border-radius: 4px; padding: 0 2px; }
.choice small.sub { display: block; color: var(--muted); font-size: .7em; font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; letter-spacing: 0; margin-top: 2px; }
.oline { min-height: 3.2em; border-bottom: 2px solid var(--line, #ddd); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 8px 2px; margin: 4px 0 12px; }
.oline.right { border-color: var(--ok, #3a8f5c); }
.oline.bad { border-color: var(--bad, #c0392b); }
.ohint { color: var(--muted); font-size: .9em; }
.oend { font-size: 1.35em; }
.opool { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; min-height: 3em; }
.otile { font-size: 1.35em; padding: 8px 14px; border-radius: 12px; border: 1.5px solid var(--line, #ddd); background: var(--card, #fff); color: inherit; cursor: pointer; }
.otile.on { background: var(--chip); border-color: var(--accent); }
.poshint { margin: 10px 0 2px; background: var(--card); border: 1.5px dashed var(--line); border-radius: 12px; padding: 8px 12px; font-size: .88em; line-height: 1.5; text-align: left; }
.poshint b { color: var(--accent); }
.pslot { border: 0; padding: 0; cursor: pointer; box-shadow: none; display: inline-grid; place-items: center; width: 1.5em; height: 1.5em; margin: 0 .12em; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-size: .62em; font-weight: 800; vertical-align: middle; font-family: inherit; }
.sentence .pyblank { display: inline-flex; flex-direction: column; align-items: center; min-width: 1.4em; margin: 0 .12em; vertical-align: bottom; }
.sentence .pyblank small { font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: .5em; color: var(--accent); line-height: 1.2; }
.sentence .pyblank i { display: block; width: 100%; height: 1em; border-bottom: 3px solid var(--accent); }
.sentence .blank { display: inline-block; min-width: 2.2em; border-bottom: 3px solid var(--accent); margin: 0 .15em; vertical-align: baseline; line-height: 1; }
.sentence-ko { text-align: center; margin: -4px 0 14px; }
/* 문장 속 단어 누르기: 아직 안 배운 단어는 점선 밑줄, 누르면 뜻이 아래에 */
.tok { cursor: pointer; border-radius: 4px; }
.tok.unk { text-decoration: underline dotted var(--muted); text-decoration-thickness: 2px; text-underline-offset: 5px; }
.tok.on { background: var(--accent-soft); }
.peek { display: block; font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; font-size: .62em; letter-spacing: 0; text-align: left; background: var(--chip); border-radius: 10px; padding: 7px 10px; margin: 8px auto 0; line-height: 1.45; max-width: 420px; animation: rise .15s ease-out; }
/* 10/20 사용자: 흐리게 하면 안 눌릴 것 같다 → 흐림 없이 똑같이 보인다 */
.peek[hidden], .choice small.sub[hidden], .sentence-py[hidden] { display: none; }
.sentence .peek { font-size: .55em; }
.peek .zh { font-family: var(--zh); font-size: 1.25em; margin-right: 6px; }
.peek .py { color: var(--accent); margin-right: 6px; }
.peek small { color: var(--muted); display: block; }
/* 안내 상자 (브라우저 기본 confirm/alert 대신 — 앱 속 브라우저에서는 기본 대화상자가 안 뜨기도 한다) */
.modal-bg { position: fixed; inset: 0; background: rgba(10, 20, 30, .45); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
.modal { background: var(--card); color: var(--ink); border-radius: 16px; padding: 18px; width: 100%; max-width: 380px; box-shadow: var(--shadow); animation: rise .2s ease-out; }
.modal p { margin: 0 0 12px; white-space: pre-line; line-height: 1.5; }
.modal textarea { width: 100%; box-sizing: border-box; min-height: 90px; font: inherit; font-size: .9em; padding: 8px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.modal .row { margin-top: 12px; }
/* 쓰기 연습 */
.wtabs { margin: 0 0 10px; }
/* 시험 구성 페이지 (ex* 접두어 — 기존 .exhead 와 다른 이름) */
.exsum { display: flex; text-align: center; padding: 14px 8px; }
.exsum > div { flex: 1; display: flex; flex-direction: column; gap: 2px; }
.exsum b { font-size: 1.4em; }
.exsum span { font-size: .8em; color: var(--muted); }
.exsec { padding: 14px 16px; }
.exhd { display: flex; justify-content: space-between; align-items: baseline; }
.exhd span { color: var(--accent); font-weight: 700; }
.exparts { list-style: none; margin: 8px 0 0; padding: 0; }
.exparts li { display: flex; align-items: flex-start; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.exn { flex: none; font-size: .78em; font-weight: 700; color: var(--muted); background: var(--chip); border-radius: 8px; padding: 2px 7px; margin-top: 2px; }
.exw { flex: 1; font-size: .95em; }
.exw small { display: block; font-size: .78em; color: var(--muted); margin-top: 2px; }
.exw small.on { color: var(--ok); font-weight: 600; }
.exk { flex: none; font-weight: 700; }
.wbtns { gap: 8px; }
.wbtns .btn { padding: 10px 4px; font-size: .95em; white-space: nowrap; }
.wgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
.wgrid button { font-family: var(--zh); font-size: 1.5em; padding: 8px 0; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); position: relative; cursor: pointer; }
.wgrid button.t { border-color: var(--warn); }
.wgrid button.p { border-color: var(--ok); background: var(--ok-soft); }
.wgrid button small { position: absolute; right: 4px; top: 2px; font-size: .5em; color: var(--muted); font-family: inherit; }
.wstage { width: 260px; height: 260px; margin: 10px auto; border: 2px solid var(--accent); border-radius: 14px; background: #fffaf2; touch-action: none; position: relative; box-shadow: var(--shadow); }
:root[data-theme="dark"] .wstage { background: #2d2724; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .wstage { background: #2d2724; } }
.wstage svg { display: block; }
.wstage .grid { position: absolute; inset: 0; pointer-events: none; }
.wstage .grid line { stroke: var(--accent); stroke-opacity: .28; stroke-dasharray: 5 6; }
.wtask { text-align: center; }
.wtask .big-zh { font-size: 3em; }
.wtask .wpy { font-size: 1.4em; color: var(--accent); font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
.wmsg { text-align: center; min-height: 1.5em; margin: 6px 0; }
.choices { display: grid; gap: 10px; }
.choice {
  text-align: left; width: 100%; min-height: 56px; padding: 12px 16px; border-radius: 16px;
  border: 1.5px solid var(--line); background: var(--card); display: flex; gap: 12px; align-items: center;
  transition: transform .08s;
}
.choice:not(:disabled):active { transform: scale(.985); }
.choice .n { flex: none; width: 28px; height: 28px; border-radius: 50%; background: var(--chip); display: grid; place-items: center; font-size: .8em; color: var(--muted); }
.choice.zhc { font-family: var(--zh); font-size: 1.35em; }
.choice.pyc { font-size: 1.15em; letter-spacing: .02em; }
.choice.picked { border-color: var(--bad); background: var(--bad-soft); }
.choice.right { border-color: var(--ok); background: var(--ok-soft); }
.choice.gone { opacity: .3; text-decoration: line-through; pointer-events: none; }
.choice:disabled { cursor: default; }
.btn:focus-visible, .choice:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.feedback { border-radius: 18px; padding: 16px; margin-top: 14px; }
.feedback.ok { background: var(--ok-soft); }
.feedback.hint { background: var(--warn-soft); }
.feedback.bad { background: var(--bad-soft); }
.feedback h3 { margin: 0 0 6px; font-size: 1.05em; }
.feedback.ok h3 { color: var(--ok); }
.feedback.hint h3 { color: var(--warn); }
.feedback.bad h3 { color: var(--bad); }
.speak { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 99px; background: var(--chip); font-size: .85em; margin-top: 6px; }
.note { font-size: .92em; margin: 6px 0 0; }
.note b { font-weight: 700; }
.mt { margin-top: 14px; }
.foot { color: var(--muted); font-size: .8em; text-align: center; margin-top: 24px; }

/* 단어 카드 */
.wcard { background: var(--card); border-radius: 14px; padding: 14px 16px; margin: 10px 0 0; }
.card .wcard { border: 1px solid var(--line); }
.wcard .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.wcard .head .zh { font-size: 1.7em; font-weight: 500; line-height: 1.3; }
.wcard .head .py { color: var(--muted); font-size: 1.1em; }
.senses { list-style: none; padding: 0; margin: 8px 0 0; }
.senses li { padding: 8px 0; border-top: 1px dashed var(--line); }
.senses li:first-child { border-top: 0; }
.senses .mean { font-weight: 700; font-size: 1.08em; }
.senses li.cur .mean { color: var(--accent); }
.ex { margin-top: 4px; }
.ex .zh { font-size: 1.15em; }
.ex .py { color: var(--muted); font-size: .88em; }
.ex .ko { font-size: .92em; }
.flash { text-align: center; padding: 28px 18px; }
/* 카드 뒷면: 뜻을 가장 크게, 예문은 아래에 따로 */
.meanbox { background: var(--accent-soft); border-radius: 16px; padding: 14px 16px; margin: 14px 0 6px; text-align: center; }
.meanbox .lbl, .exhead { font-size: .8em; color: var(--accent); font-weight: 700; letter-spacing: .02em; }
.meanbox .m { font-size: 1.4em; font-weight: 700; line-height: 1.4; margin-top: 2px; }
.meanbox .m + .m { margin-top: 8px; }
.exhead { margin: 16px 0 2px; }
.exitem { padding: 10px 0; border-top: 1px dashed var(--line); }
.exitem:first-of-type { border-top: 0; }

<script>
"use strict";
(() => {
const WORDS = window.WORDS || [];
const byN = new Map(WORDS.map(w => [w.n, w]));
const INTERVAL = [1, 3, 7, 14, 30];   // 단계 1~5 → 다음 복습까지 날 수 (맞힐 때마다 한 단계씩)

const GROUP = 5;                        // 새 단어는 5개씩: 카드 5장 → 바로 그 5개 문제

// ---------- 저장 ----------
const KEY = "hskquiz.v1";
const SESSION_V = 2; // 2: 카드 5장 → 정리 → 문제 5개 묶음(steps)
let STORAGE_OK = true;
function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { STORAGE_OK = false; return {}; }
}
try { localStorage.setItem(KEY + ".test", "1"); localStorage.removeItem(KEY + ".test"); } catch (e) { STORAGE_OK = false; }
const db = Object.assign({ prog: {}, settings: {}, session: null, days: [], stars: [], log: {}, gram: {}, write: {}, known: {}, exam: {}, drill: {} }, load());
const GRAMMAR = window.GRAMMAR || [];
const QA = window.QA || [];                                   // 질문·대답 짝 (tools/qa_answers.tsv → data/qa.js)
const qaOf = new Map(QA.map(x => [x.n + ":" + x.si, x]));
const byG = new Map(GRAMMAR.map(g => [g.id, g]));
const GRAM_MAX = 3; // 한 번에 섞는 문법 복습 문제 수
// 복습할 때가 된 문법 (카드에서 확인 문제를 푼 것만). 틀린 것 먼저
function gramDue() {
  return GRAMMAR.filter(g => db.gram[g.id] && db.gram[g.id].due && db.gram[g.id].due <= today())
    .sort((a, b) => (db.gram[a.id].last === "bad" ? 0 : 1) - (db.gram[b.id].last === "bad" ? 0 : 1) || db.gram[a.id].due.localeCompare(db.gram[b.id].due));
}
// 문법 문제: 카드의 확인 문제를 번갈아 낸다 (qi = 몇 번째 문제)
function makeGQ(g, qi) {
  const k = (qi || 0) % g.qs.length, q = g.qs[k], choices = shuffle(q.choices);
  return { kind: "grammar", gid: g.id, qi: k, n: null,
    prompt: q.type === "fill" ? `빈칸에 알맞은 말은? (뜻: ${q.ko})` : `'${q.ko}'를 맞게 쓴 문장은?`,
    // 힌트에 설명 전체를 쓰면 설명 속 예(我很忙 ○)가 정답을 알려 버린다 — 어느 카드의 문법인지만
    sentence: q.type === "fill" ? q.zh : null, choices, answer: choices.indexOf(q.answer), hint: `'${g.title}' 카드에서 배운 문법이에요.` };
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) { STORAGE_OK = false; } fileSave(); }
// 이 컴퓨터 미리보기(tools/serve.py)에서는 기록을 hsk-quiz/기록/record.json 에도 저장한다 — 앱을 다시 켜면 브라우저 저장 공간이 비워져서 (10/19)
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
let fileTimer = null, fileReady = false, fileReset = false; // fileReady: 파일에서 불러오기를 마친 뒤에만 저장
function fileSave() {
  if (!LOCAL || !fileReady) return;
  clearTimeout(fileTimer);
  fileTimer = setTimeout(() => { try { fetch("/api/record", { method: "POST", headers: Object.assign({ "Content-Type": "application/json" }, fileReset ? { "X-Reset": "1" } : {}), body: JSON.stringify(db) }).then(() => { fileReset = false; }).catch(() => {}); } catch (e) {} }, 600);
}
// 시작할 때 브라우저 기록이 비어 있으면 파일에서 불러온다
async function fileLoad() {
  if (!LOCAL || Object.keys(db.prog).length || db.days.length) return false;
  try {
    const r = await fetch("/api/record", { cache: "no-store" });
    if (!r.ok || r.status === 204) return false;
    const data = await r.json();
    if (!data || typeof data.prog !== "object" || !Object.keys(data.prog).length) return false;

  ses.cards.slice(0, ses.card + (ses.flipped && ses.card < ses.cards.length ? 1 : 0)).forEach(n => { if (!db.known[n] && introduce(n, base)) L.nw++; });
  ses.qs.forEach((q, i) => { const r = ses.res[i]; if (r && r !== "skip" && !q.retry) { L.q++; if (r === "ok") L.ok++; } });
  ses.qs.forEach((q, i) => {
    const r = ses.res[i];
    if (!r || r === "skip" || q.retry) return;
    if (!(q.n in first)) first[q.n] = { r, si: q.si, phase: q.phase, q };
  });
  const gfirst = {};
  ses.qs.forEach((q, i) => { const r = ses.res[i]; if (q.kind === "grammar" && r && r !== "skip" && !q.retry && !(q.gid in gfirst)) gfirst[q.gid] = { r, qi: q.qi }; });
  for (const [id, x] of Object.entries(gfirst)) {
    const G = db.gram[id]; if (!G) continue;
    if (x.r === "ok") { G.st = Math.min(5, (G.st || 0) + 1); G.due = addDays(base, INTERVAL[G.st - 1]); G.last = "ok"; }
    else { G.st = 0; G.due = addDays(base, 1); G.last = "bad"; G.ok = false; }
    G.qi = x.qi + 1; // 다음엔 다른 문제로
  }
  delete first.null;
  // 빠른 점검 결과 → 첫 화면에서 한 번 보여 주고, 많이 틀렸으면 한 급수 아래부터 권한다
  if (ses.mode === "check") {
    const xs = ses.qs.filter((q, i) => q.known && !q.retry && ses.res[i] && ses.res[i] !== "skip");
    S.chk = { from: S.from, n: xs.length, ok: xs.filter(q => ses.res[ses.qs.indexOf(q)] === "ok").length, seen: false };
  }
  // 구간 모의고사: 영역별(듣기·읽기·쓰기) 맞힘을 세어 db.exam 에 (넘어간 문제는 빼고 센다)
  if (ses.mode === "mock") {
    const parts = {}; let ok = 0, n = 0;
    ses.qs.forEach((q, i) => {
      const r = ses.res[i];
      if (!q.mock || q.retry || !r || r === "skip") return;
      const p = parts[q.mock] || (parts[q.mock] = [0, 0]);
      p[1]++; n++; if (r === "ok") { p[0]++; ok++; }
    });
    if (n) {
      const E = db.exam[ses.mock] || {}, pct = Math.round(ok / n * 100);
      db.exam[ses.mock] = { best: Math.max(E.best || 0, pct), last: pct, date: base, tries: (E.tries || 0) + 1, parts };
    }
  }
  // 병음 떼기: 읽기 문장을 하나라도 풀었으면 그날 몫을 한 것으로 (하루에 한 번만 센다)
  if (ses.mode === "pyb" && ses.qs.some((q, i) => q.pyb && ses.res[i] && ses.res[i] !== "skip") && !(S.pyb && S.pyb.last === base))
    S.pyb = { d: pybDone() + 1, last: base };
  // 단어 시험: 본 날·결과를 남기고, 안 배운 단어는 맞히면 익숙한 단어로(7일 뒤), 틀리면 새 단어로 남긴다(다음 공부 맨 앞)
  // 안 배운 단어: DRILL_KNOW 번 연달아(다른 날) 맞혀야 익숙한 단어. 결과 화면용으로 q.dres = known(이번에 아는 단어로)·once(한 번 맞힘)·learn(배울 단어)
  if (ses.mode === "drill") for (const [n, x] of Object.entries(first)) {
    const ok = x.r === "ok", prev = db.drill[n] || {}, c = ok ? (prev.c || 0) + 1 : 0;
    db.drill[n] = { d: base, r: ok ? "ok" : "bad", c };
    if (db.prog[n]) continue; // 배운 단어는 아래 연습 규칙으로
    if (ok && c >= DRILL_KNOW) {
      delete db.known[n];
      introduce(Number(n), base); Object.assign(db.prog[n], { st: 3, due: addDays(base, INTERVAL[2]), rc: 1, last: "ok", kn: 1 }); L.kn = (L.kn || 0) + 1;
      x.q.dres = "known";
    } else if (ok) x.q.dres = "once";
    else { delete db.known[n]; x.q.dres = "learn"; }
    delete first[n];
  }
  // 아는 단어 확인: 맞히면 익숙한 단어로(3단계 = 7일 뒤), 틀리면 표시를 풀어 다음에 새 단어 카드로 배운다
  for (const [n, x] of Object.entries(first)) {
    if (!db.known[n] || db.prog[n]) continue;
    if (db.known[n] === "skip" && ses.mode !== "check") L.sk = (L.sk || 0) + 1; // 하루 몫(점검은 안 셈)
    delete db.known[n];
    if (x.r === "ok") { introduce(Number(n), base); Object.assign(db.prog[n], { st: 3, due: addDays(base, INTERVAL[2]), rc: 1, last: "ok", kn: 1 }); L.kn = (L.kn || 0) + 1; }
    delete first[n];
  }
  for (const [n, x] of Object.entries(first)) {
    const p = db.prog[n];
    if (!p) continue;
    const w = byN.get(Number(n));
    const ok = x.r === "ok";
    if (!ok) { p.badOn = base; addMix(p, x.q); }
    if (x.phase === "practice") {
      // 연습·오답 연습: 틀리면 내일 다시, 맞히면 일정은 그대로 두고 '지금 헷갈림'만 푼다
      if (!ok) { p.st = 0; p.due = addDays(base, 1); p.wc++; p.last = "bad"; p.bad = x.si; }
      else if (p.last === "bad") { p.last = "ok"; if (p.bad === x.si) p.bad = null; }
      continue;
    }
    if (ok) {
      p.st = Math.min(5, p.st + 1); p.rc++; p.due = addDays(base, INTERVAL[p.st - 1]); p.last = "ok";
      if (p.bad === x.si) p.bad = null;
      p.sn = (x.si + 1) % w.q.length;
    } else {
      p.st = 0; p.wc++; p.due = addDays(base, 1); p.last = "bad"; p.bad = x.si;
    }
  }
  if (!db.days.includes(base)) db.days.push(base);
  ses.applied = true;
  save();
}
